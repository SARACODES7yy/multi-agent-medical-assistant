<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediAssist AI — Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>(function(){try{var s=localStorage.getItem('theme');var m=window.matchMedia('(prefers-color-scheme: light)').matches;var t=s||(m?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body class="auth-page">
    <button class="theme-toggle" onclick="toggleTheme()" style="position:fixed;top:16px;right:16px;z-index:10;" title="Toggle theme"><i class="theme-icon fas fa-moon"></i></button>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-tile" style="margin:0 auto 18px;"><i class="fas fa-heartbeat"></i></div>
                <h1 class="auth-title">Join MediAssist</h1>
                <p class="auth-subtitle">Create your account</p>
            </div>
            <div id="signup-error" class="auth-error" style="display:none;"></div>
            <form id="signup-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="su-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="su-password" placeholder="Min 6 characters" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="su-role" onchange="toggleRole()">
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                        <option value="nurse">Nurse</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="su-name" placeholder="Your full name">
                </div>
                <div id="su-professional" style="display:none;">
                    <div class="form-group">
                        <label>Qualification</label>
                        <input type="text" id="su-qualification" placeholder="e.g. MD, MBBS">
                    </div>
                </div>
                <div id="su-patient">
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="su-dob">
                    </div>
                    <div class="form-group">
                        <label>ID Type</label>
                        <select id="su-id-type"><option value="Aadhaar">Aadhaar</option><option value="Passport">Passport</option><option value="Driving License">Driving License</option><option value="Other">Other</option></select>
                    </div>
                    <div class="form-group">
                        <label>ID Number</label>
                        <input type="text" id="su-id-number" placeholder="ID number">
                    </div>
                    <div class="form-group">
                        <label>Medical History</label>
                        <textarea id="su-medical-history" rows="2" placeholder="Previous illnesses, surgeries..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Allergies</label>
                        <input type="text" id="su-allergies" placeholder="Known allergies">
                    </div>
                    <div class="form-group">
                        <label>Conditions</label>
                        <input type="text" id="su-conditions" placeholder="Current conditions">
                    </div>
                    <div class="form-group">
                        <label>Treatments</label>
                        <input type="text" id="su-treatments" placeholder="Current treatments">
                    </div>
                </div>
                <button type="submit" class="btn-primary btn-block" id="signup-btn">Create Account</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="/login">Sign in</a></p>
        </div>
    </div>
    <script>
        function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme');var nxt=cur==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',nxt);try{localStorage.setItem('theme',nxt);}catch(e){}updateThemeIcon(nxt);}
        function updateThemeIcon(t){document.querySelectorAll('.theme-icon').forEach(function(el){el.className=t==='light'?'theme-icon fas fa-moon':'theme-icon fas fa-sun';});}
        updateThemeIcon(document.documentElement.getAttribute('data-theme')||'dark');
        function toggleRole() {
            const role = document.getElementById('su-role').value;
            document.getElementById('su-professional').style.display = (role==='doctor'||role==='nurse')?'block':'none';
            document.getElementById('su-patient').style.display = role==='patient'?'block':'none';
        }
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signup-btn');
            const err = document.getElementById('signup-error');
            btn.disabled = true; btn.textContent = 'Creating...';
            err.style.display = 'none';
            const profile = { name:document.getElementById('su-name').value };
            const role = document.getElementById('su-role').value;
            if (role==='patient') {
                profile.dob=document.getElementById('su-dob').value;
                profile.id_type=document.getElementById('su-id-type').value;
                profile.id_number=document.getElementById('su-id-number').value;
                profile.medical_history=document.getElementById('su-medical-history').value;
                profile.allergies=document.getElementById('su-allergies').value;
                profile.conditions=document.getElementById('su-conditions').value;
                profile.treatments=document.getElementById('su-treatments').value;
            } else {
                profile.qualification=document.getElementById('su-qualification').value;
            }
            try {
                const r = await fetch('/signup', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({
                        email:document.getElementById('su-email').value,
                        password:document.getElementById('su-password').value,
                        role, ...profile
                    }), credentials:'include'
                });
                const d = await r.json();
                if (r.ok) window.location.href = '/dashboard';
                else { err.textContent = d.detail || 'Signup failed'; err.style.display = 'block'; }
            } catch(ex) { err.textContent = 'Network error'; err.style.display = 'block'; }
            btn.disabled = false; btn.textContent = 'Create Account';
        });
        toggleRole();
    </script>
</body>
</html>
