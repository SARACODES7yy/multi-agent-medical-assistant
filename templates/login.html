<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediAssist AI — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>(function(){try{var s=localStorage.getItem('theme');var m=window.matchMedia('(prefers-color-scheme: light)').matches;var t=s||(m?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body class="auth-page">
    <button class="theme-toggle" onclick="toggleTheme()" style="position:fixed;top:16px;right:16px;z-index:10;" title="Toggle theme"><i class="theme-icon fas fa-moon"></i></button>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-tile" style="margin:0 auto 18px;"><i class="fas fa-stethoscope"></i></div>
                <h1 class="auth-title">MediAssist</h1>
                <p class="auth-subtitle">Sign in to your account</p>
            </div>
            <div id="auth-error" class="auth-error" style="display:none;"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="login-role">
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                        <option value="nurse">Nurse</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary btn-block" id="login-btn">Sign In</button>
            </form>
            <p class="auth-footer">Don't have an account? <a href="/signup">Sign up</a></p>
        </div>
    </div>
    <script>
        function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme');var nxt=cur==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',nxt);try{localStorage.setItem('theme',nxt);}catch(e){}updateThemeIcon(nxt);}
        function updateThemeIcon(t){document.querySelectorAll('.theme-icon').forEach(function(el){el.className=t==='light'?'theme-icon fas fa-moon':'theme-icon fas fa-sun';});}
        updateThemeIcon(document.documentElement.getAttribute('data-theme')||'dark');
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('auth-error');
            btn.disabled = true; btn.textContent = 'Signing in...';
            err.style.display = 'none';
            try {
                const r = await fetch('/login', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({
                        email:document.getElementById('login-email').value,
                        password:document.getElementById('login-password').value,
                        role:document.getElementById('login-role').value
                    }), credentials:'include'
                });
                const d = await r.json();
                if (r.ok) window.location.href = '/dashboard';
                else { err.textContent = d.detail || 'Login failed'; err.style.display = 'block'; }
            } catch(ex) { err.textContent = 'Network error'; err.style.display = 'block'; }
            btn.disabled = false; btn.textContent = 'Sign In';
        });
    </script>
</body>
</html>
